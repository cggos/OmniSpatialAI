use_map_topic: true

# Frames
odom_frame_id:   "odom"
base_frame_id:   "base_footprint"
global_frame_id: "map"

# Odometry model — diff drive
odom_model_type: "diff"
odom_alpha1: 0.2
odom_alpha2: 0.2
odom_alpha3: 0.2
odom_alpha4: 0.2
odom_alpha5: 0.1

# Laser model
laser_model_type:          "likelihood_field"
laser_max_beams:           60
laser_max_range:           10.0
laser_z_hit:               0.5
laser_z_short:             0.05
laser_z_max:               0.05
laser_z_rand:              0.5
laser_sigma_hit:           0.2
laser_lambda_short:        0.1
laser_likelihood_max_dist: 2.0

# Particle filter
min_particles:    500
max_particles:    2000
kld_err:          0.05
kld_z:            0.99
update_min_d:     0.25
update_min_a:     0.2
resample_interval: 1

# Initial pose estimate (same spawn location as turtlebot2_runway.launch)
initial_pose_x:  -5.388334
initial_pose_y:  -4.094883
initial_pose_a:   0.0
initial_cov_xx:   0.25
initial_cov_yy:   0.25
initial_cov_aa:   0.0685

# Publish rate
gui_publish_rate:   10.0
transform_tolerance: 0.5
recovery_alpha_slow: 0.001
recovery_alpha_fast: 0.1

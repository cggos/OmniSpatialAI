use_map_topic: true

odom_frame_id: "odom"
base_frame_id: "base_footprint"
global_frame_id: "map"

odom_model_type: "diff"
odom_alpha5: 0.1
gui_publish_rate: 10.0
laser_max_beams: 60
laser_max_range: 12.0

# More particles: ICP odometry is imperfect, need wider search
min_particles: 1000
max_particles: 5000
kld_err: 0.05
kld_z: 0.99

# Lower alpha: laser_scan_matcher ICP is accurate in simulation,
# particles don't need to spread much between AMCL updates
odom_alpha1: 0.05
odom_alpha2: 0.05
odom_alpha3: 0.05
odom_alpha4: 0.05

# Sensor model tuned for Gazebo (near-perfect laser, no measurement noise):
#   amcl_params.yaml uses laser_sigma_hit=0.2 and laser_z_rand=0.5 (real hardware).
#   In simulation those values make AMCL too soft — ±20cm precision means ICP drift
#   of a few cm cannot be corrected.  Tighter values let AMCL recover ICP drift.
laser_z_hit: 0.8
laser_z_short: 0.05   # fixed: amcl_params.yaml has typo "aser_z_short"
laser_z_max: 0.05
laser_z_rand: 0.1
laser_sigma_hit: 0.05
laser_lambda_short: 0.1
laser_model_type: "likelihood_field"
laser_likelihood_max_dist: 1.0

# More frequent updates to correct ICP drift before it accumulates
update_min_d: 0.1
update_min_a: 0.1

resample_interval: 1

transform_tolerance: 1.0
recovery_alpha_slow: 0.001
recovery_alpha_fast: 0.1
